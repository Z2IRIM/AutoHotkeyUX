name: Modern WinUI 3 Shell

on:
  pull_request:
    paths:
      - "modern-shell/**"
      - ".github/workflows/modern-winui-shell.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        run: dotnet build modern-shell/AutoHotkeyUX.Modern.csproj -c Release -p:Platform=x64

      - name: Publish single EXE
        shell: pwsh
        run: >
          dotnet publish modern-shell/AutoHotkeyUX.Modern.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:EnableMsixTooling=true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o modern-shell/artifacts/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "modern-shell/artifacts/win-x64/AutoHotkeyUX.Modern.exe"
          if (-not (Test-Path $exe)) {
            throw "Single-file executable was not produced."
          }
          Get-Item $exe | Format-List Name, Length, FullName

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "modern-shell/artifacts/win-x64/AutoHotkeyUX.Modern.exe"
          $errorLog = Join-Path $env:LOCALAPPDATA "AutoHotkeyUX.Modern\startup-error.log"

          if (Test-Path $errorLog) {
            Remove-Item $errorLog -Force
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          if (Test-Path $errorLog) {
            Get-Content $errorLog
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "WinUI 3 startup diagnostics reported an error."
          }

          if ($process.HasExited) {
            throw "WinUI 3 executable exited during startup smoke test. Exit code: $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Startup smoke test passed: no startup error log and process remained alive for 8 seconds."

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotkeyUX.Modern-WinUI3-win-x64
          path: modern-shell/artifacts/win-x64/AutoHotkeyUX.Modern.exe
          if-no-files-found: error
